[project]
name = "django-modern-schemas"
version = "0.1.0"
description = "Generate Pydantic schemas from Django ORM models, reusing model types, constraints, defaults and relationships."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Izcar J. Munoz Torrez", email = "izcarmt95@gmail.com" }
]
requires-python = ">=3.10"
keywords =["django", "pydantic", "schema", "serialization", "validation", "orm", "openapi"]
dependencies = [
    "django>=3.2",
    "pydantic[email]>=2.12,<3",
    "typing-extensions>=4.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://open-byte.github.io/django-modern-schemas/"
Documentation = "https://open-byte.github.io/django-modern-schemas/"
Repository = "https://github.com/open-byte/django-modern-schemas"
Issues = "https://github.com/open-byte/django-modern-schemas/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django>=3.2",
    "django-stubs>=6.0.7",
    "pydantic[email,timezone]>=2.13.4",
    "pyrefly>=1.2.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]
tests = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-django>=4.12.0",
]
docs = [
    "mkdocs-material>=9.7.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
addopts = "--doctest-glob=*.md --doctest-continue-on-failure"
testpaths = ["tests", "docs"]

pythonpath = ["tests/testapp"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "IGNORE_EXCEPTION_DETAIL"]

[tool.pyrefly]
project-includes = ["src", "tests", "examples"]
project-excludes = ["**/migrations/**", "**/__pycache__/**", ".venv/**"]

search-path = ["src", ".", "examples", "tests/testapp"]

[tool.ruff]
src=["src"]
exclude = ["migrations"]
line-length = 120

[tool.ruff.lint]
fixable = ["F401", "E501", "ALL"]
unfixable = []
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "UP",  # pyupgrade,
  "I",   # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120
